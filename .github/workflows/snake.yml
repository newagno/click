name: CryptoSnake Auto-Play (3 Sessions/Day)

on:
  schedule:
    - cron: '0 6 * * *'      # 09:00 Kyiv (Ранок)
    - cron: '0 11 * * *'     # 14:00 Kyiv (День)
    - cron: '0 17 * * *'     # 20:00 Kyiv (Вечір)
  workflow_dispatch:
    inputs:
      runs:
        description: 'Кількість забігів у цій сесії'
        required: true
        default: '1'
        type: string
      dry_run:
        description: 'Режим DRY_RUN (0 = грати на повну з Space boost, 1 = симуляція 3 хв)'
        required: false
        default: '0'
        type: choice
        options:
          - '0'
          - '1'

# Ensure only one snake session runs at a time
concurrency:
  group: cryptosnake-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  play_session:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      MAX_DURATION: "2100"
      MIN_MASS_FOR_BOOST: "400"
      BLOCK_STEERING_ON_UNSAFE: "0"
      ENABLE_CORE_FX: "0"
      DRY_RUN: "0"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests python-dotenv pyautogui Pillow

      - name: Install Xvfb and GUI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot xdotool python3-tk

      - name: Proxy Sanity Check
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY || secrets.PROXY }}
          BACKUP_PROXY: ${{ secrets.BACKUP_PROXY || secrets.SECONDARY_PROXY }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from src.snake.bot import format_proxy, is_proxy_working
          for name in ('RESIDENTIAL_PROXY', 'BACKUP_PROXY'):
              raw = os.getenv(name)
              if raw:
                  clean = format_proxy(raw)
                  host_disp = clean.split('@')[-1] if clean else 'invalid'
                  print(f'[*] Testing {name}: {host_disp}...')
                  ok = is_proxy_working(raw, timeout=10)
                  print(f'[*] {name} reachable: {ok}')
                  if not ok:
                      print(f'::warning::{name} check failed.')
              else:
                  print(f'[*] No {name} configured')
          "

      - name: Run CryptoSnake Bot
        env:
          INCRYPTED_EMAIL: ${{ secrets.INCRYPTED_EMAIL }}
          INCRYPTED_PASSWORD: ${{ secrets.INCRYPTED_PASSWORD }}
          INCRYPTED_COOKIES: ${{ secrets.INCRYPTED_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY || secrets.PROXY }}
          BACKUP_PROXY: ${{ secrets.BACKUP_PROXY || secrets.SECONDARY_PROXY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || '0' }}
        run: |
          RUNS_COUNT="${{ github.event.inputs.runs || '1' }}"
          echo "[*] Launching CryptoSnake bot with $RUNS_COUNT runs (DRY_RUN=$DRY_RUN)..."
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python src/snake/run.py "$RUNS_COUNT"

      - name: Commit and Push cookies
        if: always()
        run: |
          if [[ -n $(git status -s incrypted_cookies.json) ]]; then
            git config --global user.name "github-actions[bot]"
            git config --global user.email "github-actions[bot]@users.noreply.github.com"
            git add incrypted_cookies.json
            git commit -m "Update cookies [skip ci]" || echo "No changes"
            git pull --rebase origin main || true
            git push origin HEAD:main || true
          fi

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-debug-${{ github.run_id }}
          path: |
            *.png
            *.json
            src/snake/*.log
          retention-days: 3
