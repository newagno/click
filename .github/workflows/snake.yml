name: CryptoSnake Auto-Play (3 Sessions/Day)

on:
  schedule:
    - cron: '0 6 * * *'      # 09:00 Kyiv (Ранок)
    - cron: '0 11 * * *'     # 14:00 Kyiv (День)
    - cron: '0 17 * * *'     # 20:00 Kyiv (Вечір)
  workflow_dispatch:
    inputs:
      runs:
        description: 'Кількість забігів у цій сесії'
        required: true
        default: '1'
        type: string

# Ensure only one snake session runs at a time
concurrency:
  group: cryptosnake-session
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  play_session:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install requests python-dotenv pyautogui Pillow

      - name: Install Xvfb and GUI tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb scrot xdotool python3-tk

      - name: Proxy Sanity Check
        env:
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY }}
        run: |
          python -c "
          import os, sys
          sys.path.insert(0, '.')
          from src.snake.bot import format_proxy, is_proxy_working
          raw = os.getenv('RESIDENTIAL_PROXY')
          if raw:
              clean = format_proxy(raw)
              host_disp = clean.split('@')[-1] if clean else 'invalid'
              print(f'[*] Testing proxy: {host_disp}...')
              ok = is_proxy_working(raw, timeout=10)
              print(f'[*] Proxy reachable: {ok}')
              if not ok:
                  print('::warning::Proxy check failed (407 Auth or Timeout). Bot will attempt direct connection or Turnstile bypass.')
          else:
              print('[*] No RESIDENTIAL_PROXY configured')
          "

      - name: Run CryptoSnake Bot
        env:
          INCRYPTED_EMAIL: ${{ secrets.INCRYPTED_EMAIL }}
          INCRYPTED_PASSWORD: ${{ secrets.INCRYPTED_PASSWORD }}
          INCRYPTED_COOKIES: ${{ secrets.INCRYPTED_COOKIES }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          RESIDENTIAL_PROXY: ${{ secrets.RESIDENTIAL_PROXY || secrets.PROXY }}
          BACKUP_PROXY: ${{ secrets.BACKUP_PROXY || secrets.SECONDARY_PROXY }}
        run: |
          RUNS_COUNT="${{ github.event.inputs.runs || '1' }}"
          echo "[*] Launching CryptoSnake bot with $RUNS_COUNT runs..."
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python src/snake/run.py "$RUNS_COUNT"

      - name: Upload debug artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snake-debug-${{ github.run_id }}
          path: |
            *.png
            *.json
            src/snake/*.log
          retention-days: 3
